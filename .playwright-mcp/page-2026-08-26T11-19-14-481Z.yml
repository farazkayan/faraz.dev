      - generic [ref=f1e113]:
        - generic [ref=f1e114]: About
        - heading "About" [level=2] [ref=f1e115]
      - generic [ref=f1e116]:
        - generic [ref=f1e117]:
          - paragraph [ref=f1e118]: I got into technology because something about it just clicked. There's a particular satisfaction in taking separate pieces — code, services, hardware — and making them work together as a coherent whole.
          - paragraph [ref=f1e119]: I tend to build things when I notice something that doesn't exist yet, or when an existing tool doesn't quite work the way I need it to. "I build things I wish existed" isn't a tagline — it's genuinely how most of my projects start.
        - generic [ref=f1e120]:
          - paragraph [ref=f1e121]: I'm still a student, currently learning Python in school. Most of what I know beyond that has come from actually building projects and investigating why they break.
          - paragraph [ref=f1e122]: AI is a big part of how I work — tools like Kilo Code, Roo Code, Claude, Gemini, Aider, NVIDIA NIM, and LM Studio are in my daily workflow. But I don't just accept what they generate. When something fails, I dig in to understand the problem first, then use AI to help pinpoint and fix it. Learning why something broke means I'm less likely to hit the same wall twice.
        - generic [ref=f1e123]:
          - paragraph [ref=f1e124]: Building projects has pulled me into areas beyond just writing code. I've spent a lot of time with Linux servers, Docker, self-hosting, databases, media storage, and networking — not because I set out to learn "DevOps," but because the things I wanted to build required it.
          - paragraph [ref=f1e125]: "I run a few things at home: CasaOS for a dashboard, Immich for photos, Jellyfin for media, and a couple of Minecraft servers for friends. It's taught me that the best way to learn infrastructure is to actually run it."
        - paragraph [ref=f1e127]:
          - text: When I'm not building, I'm probably taking photos of cats, playing Stray for the third time, or convincing friends to go on a random side quest. The dedicated
          - link "Hobbies" [ref=f1e128] [cursor=pointer]:
            - /url: "#hobbies"
          - text: section has more on that.
